name: signlanguage
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  gal: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  tflite_flutter: ^0.12.1
  google_mlkit_pose_detection: ^0.13.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  file_picker: ^13.3.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Only this file in assets/models/ is used by the app (stage1_inference_service.dart).
    # Listing the whole folder also bundled ~1.2 GB of unused copies (model.safetensors etc.).
    - assets/models/stage1_model_float32.tflite
    - saved_models/stage1_model.onnx
    - saved_models/stage1_model.onnx.data
    - saved_models/gloss_to_id.json
    - saved_models/encoder_model.onnx
    - saved_models/encoder_model.onnx.data
    - saved_models/decoder_model_quantized.onnx
    - saved_models/kobart_tokenizer.json
    - saved_models/kobart_config.json
    # Text -> sign language (TextToSignChannel.kt)
    - saved_models/TextToSignLanguage/t2g_encoder.onnx
    - saved_models/TextToSignLanguage/t2g_decoder.onnx
    - saved_models/TextToSignLanguage/t2g_config.json
    - saved_models/TextToSignLanguage/t2g_tokenizer/tokenizer.json
    - saved_models/TextToSignLanguage/g2p_encoder.onnx
    - saved_models/TextToSignLanguage/g2p_decoder.onnx
    - saved_models/TextToSignLanguage/g2p_config.json
    - saved_models/TextToSignLanguage/gloss_to_id.json
