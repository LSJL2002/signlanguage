name: signlanguage
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  gal: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  tflite_flutter: ^0.12.1
  google_mlkit_pose_detection: ^0.13.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - saved_models/stage1_model.onnx
    - saved_models/stage1_model.onnx.data
    - saved_models/gloss_to_id.json
    - saved_models/encoder_model.onnx
    - saved_models/encoder_model.onnx.data
    - saved_models/decoder_model_quantized.onnx
    - saved_models/kobart_tokenizer.json
    - saved_models/kobart_config.json
